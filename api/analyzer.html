<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Zyventra IAM Role Analyzer</title>

    <style>
        body {
            background: #0a0a0a;
            color: #eee;
            font-family: Arial, sans-serif;
            padding: 2rem;
        }

        h1 {
            color: #00cc66;
        }

        textarea {
            width: 100%;
            height: 300px;
            background: #1e1e1e;
            color: #d4d4d4;
            padding: 1rem;
            font-family: monospace;
            border: 1px solid #444;
            border-radius: 6px;
            resize: vertical;
        }

        button {
            padding: 1rem 2rem;
            background: #0070f3;
            border: none;
            color: white;
            font-size: 1.1rem;
            border-radius: 6px;
            cursor: pointer;
            margin-top: 1rem;
        }

        button:hover {
            background: #0058c7;
        }

        .result {
            margin-top: 2rem;
            background: #1a1a1a;
            padding: 1.5rem;
            border-radius: 8px;
        }

        .role-card {
            border-left: 4px solid #00cc66;
            padding-left: 1rem;
            margin: 1rem 0;
        }

        .finding {
            color: #ffaa00;
        }

        a {
            color: #4da6ff;
        }
    </style>
</head>
<body>

    <h1>🛡️ Zyventra IAM Role Analyzer</h1>

    <p>
        Apna Terraform IAM code neeche paste karein aur
        <strong>Analyze</strong> dabayein. (Version 1–4 features)
    </p>

    <textarea
        id="codeInput"
        placeholder='resource "aws_iam_role" "example" { ... }'
    ></textarea>

    <br>

    <button onclick="runAnalysis()">🔍 Analyze Now</button>

    <div id="output" class="result"></div>

    <p>
        <small>
            Last scan results automatically saved in
            <a href="/dashboard.html">Dashboard</a>.
        </small>
    </p>

    <script>
        async function runAnalysis() {
            const code = document.getElementById("codeInput").value;
            const output = document.getElementById("output");

            output.innerHTML = "Analyzing...";

            try {
                const response = await fetch("/api/analyze", {
                    method: "POST",
                    headers: {
                        "Content-Type": "application/json"
                    },
                    body: JSON.stringify({
                        terraform_code: code
                    })
                });

                const data = await response.json();

                if (!data.success) {
                    output.innerHTML =
                        `<p style="color:red;">Error: ${data.error}</p>`;
                    return;
                }

                let html =
                    `<h2>Analysis Result (${data.roles.length} roles)</h2>`;

                data.roles.forEach(role => {
                    html += `
                        <div class="role-card">
                            <strong>${role.name}</strong>
                            <p>
                                Last Used:
                                <b>${role.last_used_days}</b> days ago
                            </p>
                            <ul>
                                ${role.findings
                                    .map(f =>
                                        `<li class="finding">${f}</li>`
                                    )
                                    .join("")}
                            </ul>
                        </div>
                    `;
                });

                output.innerHTML = html;

                // Save scan history for dashboard
                const history = JSON.parse(
                    localStorage.getItem("iamScanHistory") || "[]"
                );

                history.push({
                    date: new Date().toLocaleString(),
                    roles: data.roles
                });

                localStorage.setItem(
                    "iamScanHistory",
                    JSON.stringify(history)
                );

            } catch (error) {
                output.innerHTML =
                    `<p style="color:red;">Request failed: ${error.message}</p>`;
            }
        }
    </script>

</body>
</html>
