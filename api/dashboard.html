<!DOCTYPE html>
<html>
<head>
    <title>Zyventra Dashboard</title>
    <style>
        body { background: #0a0a0a; color: #eee; font-family: sans-serif; padding: 2rem; }
        table { border-collapse: collapse; width: 100%; }
        th, td { border: 1px solid #444; padding: 8px; }
        th { background: #333; }
        button { padding: 0.5rem 1rem; background: #0070f3; border: none; color: white; border-radius: 4px; cursor: pointer; }
    </style>
</head>
<body>
    <h1>📊 IAM Scan History Dashboard</h1>
    <p>Yeh page puri scan history dikhata hai (localStorage).</p>
    <button onclick="clearHistory()">Clear History</button>
    <button onclick="window.location.href='/analyzer.html'">New Scan</button>
    <div id="history"></div>

    <script>
        function loadHistory() {
            let history = JSON.parse(localStorage.getItem('iamScanHistory') || '[]');
            let container = document.getElementById('history');
            if (history.length === 0) {
                container.innerHTML = '<p>No scans yet.</p>';
                return;
            }
            let table = '<table><tr><th>Date</th><th>Roles</th><th>Findings</th></tr>';
            history.forEach(entry => {
                let totalFindings = entry.roles.reduce((sum, r) => sum + r.findings.length, 0);
                table += `<tr><td>${entry.date}</td><td>${entry.roles.length}</td><td>${totalFindings}</td></tr>`;
            });
            table += '</table>';
            container.innerHTML = table;
        }

        function clearHistory() {
            localStorage.removeItem('iamScanHistory');
            loadHistory();
        }

        loadHistory();
    </script>
</body>
</html>
