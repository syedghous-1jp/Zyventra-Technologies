name: 'Zyventra Cloud Security Scanner'
description: 'Scan your IaC code and live cloud infrastructure for security drifts and misconfigurations.'
author: 'Zyventra Technologies'

inputs:
  terraform_state:
    description: 'Path to the terraform.tfstate file'
    required: false
    default: 'terraform.tfstate'
  rules_dir:
    description: 'Path to the security rules directory'
    required: false
    default: 'rules'

runs:
  using: 'node20'
  main: 'index.js'

branding:
  icon: 'shield'
  color: 'green'
